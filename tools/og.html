<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  html, body { margin: 0; overflow: hidden; }
  .og { width: 1200px; height: 630px; padding: 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .og h1 { font-size: 78px; line-height: 1.12; letter-spacing: -.018em; margin: 0; max-width: 16em; }
  .og h1 span { display: block; color: #e8cda4; }
  .og .brand { font-size: 30px; }
  .og p { font-size: 26px; margin: 0; color: #98a29e; }
  .icon { display: none; width: 512px; height: 512px; background: #0f1a1e; place-items: center; }
  .icon i { display: block; width: 320px; height: 320px; border-radius: 50%; background: #e8cda4; }
  html.is-icon .og { display: none; }
  html.is-icon .icon { display: grid; }
</style>
<script>
  document.documentElement.dataset.theme = "dark";
  if (location.hash === "#icon") document.documentElement.classList.add("is-icon");
</script>
</head>
<body>
<div class="og">
  <div class="brand">Honest Mirror</div>
  <h1>People keep calling you a narcissist. <span>Are they right?</span></h1>
  <p>A free, private test that checks its own answers. Not a diagnosis.</p>
</div>
<div class="icon"><i></i></div>
</body>
</html>
